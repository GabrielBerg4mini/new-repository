<section
  class="flex flex-col items-center gap-10 py-20 mt-24 md:flex-row md:justify-between md:items-center"
>
  <article class="w-full text-center md:text-left">
    <p class="mb-3 font-mono text-base font-semibold text-zinc-50 sm:text-lg md:text-xl">
      {{ 'hero.saudation' | translate }} Gabriel
    </p>
    <h1
      class="mb-2 text-3xl font-bold leading-tight bg-clip-text text-transparent bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500 sm:text-4xl md:text-5xl lg:text-6xl"
    >
      {{ 'hero.developer_front_text' | translate }} &amp;
    </h1>
    <h2
      class="mb-4 text-4xl font-bold leading-tight bg-clip-text text-transparent bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500 sm:text-5xl md:text-6xl lg:text-7xl"
    >
      {{ 'hero.developer_mobile_text' | translate }}
    </h2>
    <p
      class="mx-auto text-sm font-semibold leading-relaxed text-gray-400 sm:text-base md:mx-0 md:text-lg"
    >
      {{ 'hero.first_description' | translate }}
    </p>
    <p
      class="mx-auto mt-2 text-sm font-semibold leading-relaxed text-gray-400 sm:text-base md:mx-0 md:text-lg"
    >
      {{ 'hero.second_description' | translate }}
    </p>
    <a
      routerLink="/resume"
      class="group relative mt-6 inline-flex overflow-hidden rounded-lg p-px bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500 md:mt-8"
      aria-label="Open Resume"
    >
      <span
        class="relative block rounded-[calc(var(--radius-lg)-1px)] bg-zinc-900 px-5 py-3 text-sm font-semibold text-white sm:px-6 sm:text-base"
      >
        <span
          aria-hidden="true"
          class="absolute inset-0 origin-left scale-x-0 rounded-[calc(var(--radius-lg)-1px)] bg-linear-to-r from-cyan-500 via-sky-500 to-blue-600 transition-transform duration-500 ease-out group-hover:scale-x-100"
        ></span>
        <span class="relative z-10">{{ 'hero.open_resume' | translate }}</span>
      </span>
    </a>
  </article>
  <div class="border-gradient">
    <div class="frame"></div>
    <div class="image-wrapper">
      <img
        ngSrc="/images/my-photo.jpeg"
        alt="My Photo"
        fill
        priority
        sizes="(max-width: 768px) 100vw, 30vw"
        class="object-cover object-center"
      />
    </div>
  </div>
</section>
