<section
  class="flex flex-col items-center gap-10 py-20 mt-24 md:flex-row md:justify-between md:items-center"
>
  <article appReveal class="w-full text-center md:text-left">
    <p
      class="mb-3 font-mono text-base font-semibold dark:text-zinc-50 text-gray-950 sm:text-lg md:text-xl"
    >
      {{ 'hero.saudation' | translate }} Gabriel
    </p>
    <h1
      class="mb-2 text-3xl font-bold leading-tight bg-clip-text text-transparent bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500 sm:text-4xl md:text-5xl lg:text-6xl"
    >
      {{ 'hero.developer_front_text' | translate }} &amp;
    </h1>
    <h2
      class="mb-4 text-4xl font-bold leading-tight bg-clip-text text-transparent bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500 sm:text-5xl md:text-6xl lg:text-7xl"
    >
      {{ 'hero.developer_mobile_text' | translate }}
    </h2>
    <p
      class="mx-auto text-sm font-semibold leading-relaxed text-gray-400 sm:text-base md:mx-0 md:text-lg"
    >
      {{ 'hero.first_description' | translate }}
    </p>
    <p
      class="mx-auto mt-2 text-sm font-semibold leading-relaxed text-gray-400 sm:text-base md:mx-0 md:text-lg"
    >
      {{ 'hero.second_description' | translate }}
    </p>
    <a
      routerLink="/resume"
      class="group relative mt-6 inline-flex overflow-hidden rounded-lg p-px bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500 md:mt-8"
      aria-label="Open Resume"
    >
      <span
        class="relative block rounded-[calc(var(--radius-lg)-1px)] bg-zinc-900 px-5 py-3 text-sm font-semibold text-white sm:px-6 sm:text-base"
      >
        <span
          aria-hidden="true"
          class="absolute inset-0 origin-left scale-x-0 rounded-[calc(var(--radius-lg)-1px)] bg-linear-to-r from-cyan-500 via-sky-500 to-blue-600 transition-transform duration-500 ease-out group-hover:scale-x-100"
        ></span>
        <span class="relative z-10">{{ 'hero.open_resume' | translate }}</span>
      </span>
    </a>
  </article>
  <article [appReveal]="250">
    <app-photo-me-component />
    <section class="flex gap-4 mt-4">
      <a
        href="https://github.com/GabrielBerg4mini"
        target="_blank"
        rel="noopener noreferrer"
        class="group relative inline-flex overflow-hidden rounded-lg p-px bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500"
        title="GitHub"
      >
        <span
          class="relative flex h-12 w-12 items-center justify-center rounded-[calc(var(--radius-lg)-1px)] bg-zinc-900 text-white"
        >
          <span
            aria-hidden="true"
            class="absolute inset-0 origin-left scale-x-0 rounded-[calc(var(--radius-lg)-1px)] bg-linear-to-r from-cyan-500 via-sky-500 to-blue-600 transition-transform duration-500 ease-out group-hover:scale-x-100"
          ></span>
          <span class="sr-only">GitHub</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github relative z-10"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path
              d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"
            />
          </svg>
        </span>
      </a>

      <a
        href="https://www.linkedin.com/in/gabriel-bergamini/"
        target="_blank"
        rel="noopener noreferrer"
        class="group relative inline-flex overflow-hidden rounded-lg p-px bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500"
        title="Linkedin"
      >
        <span
          class="relative flex h-12 w-12 items-center justify-center rounded-[calc(var(--radius-lg)-1px)] bg-zinc-900 text-white"
        >
          <span
            aria-hidden="true"
            class="absolute inset-0 origin-left scale-x-0 rounded-[calc(var(--radius-lg)-1px)] bg-linear-to-r from-cyan-500 via-sky-500 to-blue-600 transition-transform duration-500 ease-out group-hover:scale-x-100"
          ></span>
          <span class="sr-only">Linkedin</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-brand-linkedin relative z-10"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M8 11v5" />
            <path d="M8 8v.01" />
            <path d="M12 16v-5" />
            <path d="M16 16v-3a2 2 0 1 0 -4 0" />
            <path
              d="M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4l0 -10"
            />
          </svg>
        </span>
      </a>

      <a
        href="mailto:gabrielbergaminioficial@gmail.com"
        target="_blank"
        rel="noopener noreferrer"
        class="group relative inline-flex overflow-hidden rounded-lg p-px bg-linear-to-r from-cyan-400 via-sky-400 to-blue-500"
        title="E-mail"
      >
        <span
          class="relative flex h-12 w-12 items-center justify-center rounded-[calc(var(--radius-lg)-1px)] bg-zinc-900 text-white"
        >
          <span
            aria-hidden="true"
            class="absolute inset-0 origin-left scale-x-0 rounded-[calc(var(--radius-lg)-1px)] bg-linear-to-r from-cyan-500 via-sky-500 to-blue-600 transition-transform duration-500 ease-out group-hover:scale-x-100"
          ></span>
          <span class="sr-only">Mail</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-mail relative z-10"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path
              d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10"
            />
            <path d="M3 7l9 6l9 -6" />
          </svg>
        </span>
      </a>
    </section>
  </article>
</section>
