<section id="projects" class="scroll-mt-8 py-20">
  <app-section-title-component
    [eyebrow]="'projects.eyebrow' | translate"
    [title]="'projects.title' | translate"
  />

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    @for (project of projects; track project.key; let i = $index) {
      <div
        [appReveal]="i * 150"
        class="group rounded-2xl bg-border p-px transition-all duration-500 hover:bg-linear-to-r hover:from-cyan-400 hover:via-sky-400 hover:to-blue-500 hover:shadow-[0_20px_60px_rgba(14,165,233,0.18)]"
      >
        <article class="flex h-full flex-col rounded-[calc(var(--radius-2xl)-1px)] bg-surface p-6">
          <div class="mb-4 flex items-center justify-between gap-3">
            <svg lucideFolderGit2 [size]="28" aria-hidden="true" class="text-sky-400"></svg>
            <span class="font-mono text-xs font-semibold text-foreground-muted">
              {{ project.key + '.period' | translate }}
            </span>
          </div>
          <h3 class="mb-2 text-lg font-semibold text-foreground">
            {{ project.key + '.name' | translate }}
          </h3>
          <p class="mb-6 text-sm leading-relaxed text-foreground-muted sm:text-base">
            {{ project.key + '.description' | translate }}
          </p>
          <ul class="mt-auto flex flex-wrap gap-2">
            @for (tag of project.tags; track tag) {
              <li>
                <app-chip-component>{{ tag }}</app-chip-component>
              </li>
            }
          </ul>
        </article>
      </div>
    }
  </div>
</section>
